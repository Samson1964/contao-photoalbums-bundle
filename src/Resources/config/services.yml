# Dienstdefinitionen der Fotoalben.
#
# Registriert werden nur die Klassen, die Contao selbst aufrufen muss:
# der tägliche Cron-Auftrag für die RSS-/Atom-Feeds, die Migration, die die
# Altdaten aus tl_translation_fields in die Textfelder zurückholt, der Reiter
# „Fotoalben“ im Link-Picker und die Insert-Tags {{photoalbum_url::…}} & Co.
#
# Frontend-Module, Inhaltselement und Widgets hängen dagegen in den globalen
# Feldern FE_MOD, TL_CTE und BE_FFL (siehe Resources/contao/config/config.php);
# die Rückrufe der Datenbereiche stehen als Klassennamen in den DCA-Dateien.
# Beides funktioniert in Contao 4.13 wie in Contao 5 und braucht keinen Dienst.
services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Schachbulle\ContaoPhotoalbumsBundle\Feed\:
        resource: '../../Feed'

    Schachbulle\ContaoPhotoalbumsBundle\Migration\:
        resource: '../../Migration'

    # Beide Fassungen versehen Picker-Provider bei autoconfigure von selbst mit
    # dem Tag — ohne Priorität. Zusammen mit dem Tag hier stünde der Reiter
    # dann zweimal im Picker. Die Priorität 32 setzt ihn hinter FAQ und vor
    # Artikel. Übergeben wird der Autorisierungsprüfer statt security.helper:
    # Dessen Klasse liegt in 4.13 und 5 in verschiedenen Namensräumen.
    Schachbulle\ContaoPhotoalbumsBundle\Picker\PhotoalbumPickerProvider:
        autowire: false
        autoconfigure: false
        arguments:
            - '@knp_menu.factory'
            - '@router'
            - '@translator'
            - '@security.authorization_checker'
        tags:
            - { name: contao.picker_provider, priority: 32 }

    Schachbulle\ContaoPhotoalbumsBundle\EventListener\InsertTagsListener:
        tags:
            - { name: contao.hook, hook: replaceInsertTags }
